<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSNode v0.0.2 - Javascript Node Editor</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- React Flow -->
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.9.0/dist/style.css">
  <script src="https://unpkg.com/reactflow@11.9.0/dist/umd/index.min.js"></script>
  
  <!-- Babel for JSX (development only) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="root"></div>
  
  <!-- Core Types & Constants -->
  <script src="js/core.js"></script>
  
  <!-- Application -->
  <script type="text/babel" src="js/editor.js"></script>
  
  <!-- Runtime Engine -->
  <script src="js/runtime.js"></script>
  
  <!-- Initialize -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const ReactFlow = window.ReactFlow;
    const Background = window.ReactFlow.Background;
    const Controls = window.ReactFlow.Controls;
    const MiniMap = window.ReactFlow.MiniMap;
    const addEdge = window.ReactFlow.addEdge;
    const useNodesState = window.ReactFlow.useNodesState;
    const useEdgesState = window.ReactFlow.useEdgesState;
    const useReactFlow = window.ReactFlow.useReactFlow;
    
    // Theme from core.js
    const THEME = JSNodeCore.THEME;
    const NodeType = JSNodeCore.NodeType;
    const ExecutionState = JSNodeCore.ExecutionState;
    
    // Initial Nodes
    const initialNodes = [
      { 
        id: '1', 
        type: 'input',
        position: { x: 100, y: 100 }, 
        data: { label: 'Input Node' },
        style: { border: `2px solid ${THEME.colors.primary}` }
      },
      { 
        id: '2', 
        type: 'output',
        position: { x: 400, y: 100 }, 
        data: { label: 'Output Node' }
      },
    ];
    
    const initialEdges = [];
    
    // Custom Node Component
    const CustomNode = ({ data, selected }) => {
      return (
        <div className={`jsnode-node ${selected ? 'selected' : ''}`} style={{
          background: THEME.colors.background,
          border: `2px solid ${THEME.colors.primary}`,
          borderRadius: '8px',
          padding: '12px',
          minWidth: '150px',
          boxShadow: '0 2px 8px rgba(0,0,0,0.1)'
        }}>
          <div className="node-header" style={{
            borderBottom: `1px solid ${THEME.colors.grid}`,
            paddingBottom: '8px',
            marginBottom: '8px',
            fontWeight: 'bold',
            color: THEME.colors.text
          }}>
            {data.label}
          </div>
          <div className="node-ports">
            <div className="port input" style={{
              width: '12px',
              height: '12px',
              background: THEME.colors.primary,
              borderRadius: '50%',
              position: 'absolute',
              left: '-6px',
              top: '50%'
            }}></div>
            <div className="port output" style={{
              width: '12px',
              height: '12px',
              background: THEME.colors.primary,
              borderRadius: '50%',
              position: 'absolute',
              right: '-6px',
              top: '50%'
            }}></div>
          </div>
        </div>
      );
    };
    
    // Main App Component
    function App() {
      const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
      const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
      const [activeWorkspace, setActiveWorkspace] = useState('Workspace 1');
      const [consoleOpen, setConsoleOpen] = useState(false);
      const [debugOpen, setDebugOpen] = useState(false);
      const [simSpeed, setSimSpeed] = useState(100);
      
      const onConnect = useCallback((params) => {
        setEdges((eds) => addEdge({
          ...params,
          type: 'default',
          animated: true,
          style: { stroke: THEME.colors.primary, strokeWidth: 2 }
        }, eds));
      }, [setEdges]);
      
      const nodeTypes = {
        input: CustomNode,
        output: CustomNode,
        standard: CustomNode,
      };
      
      return (
        <div className="app-container" style={{
          width: '100vw',
          height: '100vh',
          display: 'flex',
          flexDirection: 'column',
          background: THEME.colors.background
        }}>
          {/* Primary Nav Bar (Excel Mimic) */}
          <nav className="primary-nav" style={{
            height: THEME.nav.height,
            background: THEME.colors.navBackground,
            borderBottom: `1px solid ${THEME.colors.grid}`,
            display: 'flex',
            alignItems: 'center',
            padding: '0 16px',
            gap: '24px'
          }}>
            <div className="logo-group" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ fontWeight: 'bold', color: THEME.colors.primary }}>JSNode</span>
              <span style={{ fontSize: '10px', color: THEME.colors.text, opacity: THEME.versionBadge.opacity }}>v0.0.2</span>
            </div>
            
            <div className="node-types-group" style={{ display: 'flex', gap: '8px' }}>
              <button className="nav-btn">Input</button>
              <button className="nav-btn">Output</button>
              <button className="nav-btn">Standard</button>
              <button className="nav-btn">API</button>
              <button className="nav-btn">Workspace</button>
            </div>
            
            <div className="edit-group" style={{ display: 'flex', gap: '8px' }}>
              <button className="nav-btn">Undo</button>
              <button className="nav-btn">Redo</button>
              <button className="nav-btn">Save</button>
            </div>
            
            <div className="view-group" style={{ display: 'flex', gap: '8px' }}>
              <button className="nav-btn" onClick={() => setConsoleOpen(!consoleOpen)}>Console</button>
              <button className="nav-btn" onClick={() => setDebugOpen(!debugOpen)}>Debug</button>
              <button className="nav-btn">Minimap</button>
            </div>
            
            <div style={{ marginLeft: 'auto', display: 'flex', gap: '16px', alignItems: 'center' }}>
              <button className="nav-btn">⚙️</button>
              <div className="account-icon" style={{
                width: '32px',
                height: '32px',
                borderRadius: '50%',
                background: THEME.colors.primary,
                color: 'white',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                cursor: 'pointer'
              }}>👤</div>
            </div>
          </nav>
          
          {/* Simulate Bar (Below Primary Nav) */}
          <div className="simulate-bar" style={{
            height: '40px',
            background: '#E8F4FD',
            borderBottom: `1px solid ${THEME.colors.grid}`,
            display: 'flex',
            alignItems: 'center',
            padding: '0 16px',
            gap: '16px'
          }}>
            <button className="simulate-btn" style={{
              background: THEME.colors.stateGreen,
              color: 'white',
              border: 'none',
              padding: '8px 16px',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}>▶ Simulate</button>
            
            <label style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              Speed:
              <input 
                type="range" 
                min="10" 
                max="1000" 
                value={simSpeed}
                onChange={(e) => setSimSpeed(Number(e.target.value))}
                style={{ width: '100px' }}
              />
              <span>{simSpeed}ms</span>
            </label>
            
            <button className="debug-btn" style={{
              background: 'transparent',
              border: `1px solid ${THEME.colors.stateBlue}`,
              color: THEME.colors.stateBlue,
              padding: '4px 8px',
              borderRadius: '4px',
              cursor: 'pointer',
              display: 'flex',
              alignItems: 'center',
              gap: '4px'
            }}>
              🐛 Debug
            </button>
          </div>
          
          {/* Main Canvas */}
          <div className="canvas-container" style={{ flex: 1, position: 'relative' }}>
            <ReactFlow
              nodes={nodes}
              edges={edges}
              onNodesChange={onNodesChange}
              onEdgesChange={onEdgesChange}
              onConnect={onConnect}
              nodeTypes={nodeTypes}
              fitView
              snapToGrid={true}
              snapGrid={[THEME.grid.baseSize, THEME.grid.baseSize]}
              style={{ background: THEME.colors.background }}
            >
              <Background 
                color={THEME.colors.grid} 
                gap={THEME.grid.baseSize}
                size={1}
              />
              <Controls />
              <MiniMap 
                nodeStrokeColor={THEME.colors.primary}
                nodeColor={(node) => {
                  switch(node.type) {
                    case 'input': return THEME.colors.stateGreen;
                    case 'output': return THEME.colors.stateBlue;
                    default: return THEME.colors.primary;
                  }
                }}
                maskColor="rgba(240, 240, 240, 0.6)"
              />
            </ReactFlow>
            
            {/* Console Drawer (Right Side) */}
            <div className={`console-drawer ${consoleOpen ? 'open' : 'closed'}`} style={{
              position: 'absolute',
              right: 0,
              top: 0,
              bottom: 0,
              width: consoleOpen ? '300px' : '0px',
              background: '#1E1E1E',
              color: '#FFFFFF',
              transition: 'width 0.3s ease',
              overflow: 'hidden',
              borderLeft: `1px solid ${THEME.colors.grid}`
            }}>
              <div className="console-header" style={{
                padding: '12px',
                borderBottom: '1px solid #333',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span>Console</span>
                <button onClick={() => setConsoleOpen(false)} style={{
                  background: 'transparent',
                  border: 'none',
                  color: 'white',
                  cursor: 'pointer'
                }}>✕</button>
              </div>
              <div className="console-output" style={{
                padding: '12px',
                fontFamily: 'monospace',
                fontSize: '12px'
              }}>
                <div style={{ color: '#4CAF50' }}>// Console ready</div>
                <div style={{ color: '#2196F3' }}>// JSNode v0.0.2</div>
              </div>
            </div>
            
            {/* Console Toggle Button */}
            <button 
              className="console-toggle"
              onClick={() => setConsoleOpen(!consoleOpen)}
              style={{
                position: 'absolute',
                right: consoleOpen ? '300px' : '0px',
                top: '50%',
                transform: 'translateY(-50%)',
                background: THEME.colors.primary,
                border: 'none',
                color: 'white',
                padding: '8px 12px',
                borderRadius: '4px 0 0 4px',
                cursor: 'pointer',
                transition: 'right 0.3s ease'
              }}
            >
              {consoleOpen ? '›' : '‹'}
            </button>
            
            {/* Debug Drawer (Left Side) */}
            <div className={`debug-drawer ${debugOpen ? 'open' : 'closed'}`} style={{
              position: 'absolute',
              left: 0,
              top: 0,
              bottom: 0,
              width: debugOpen ? '300px' : '0px',
              background: '#1E1E1E',
              color: '#FFFFFF',
              transition: 'width 0.3s ease',
              overflow: 'hidden',
              borderRight: `1px solid ${THEME.colors.grid}`
            }}>
              <div className="debug-header" style={{
                padding: '12px',
                borderBottom: '1px solid #333',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span>🐛 Debug</span>
                <button onClick={() => setDebugOpen(false)} style={{
                  background: 'transparent',
                  border: 'none',
                  color: 'white',
                  cursor: 'pointer'
                }}>✕</button>
              </div>
              <div className="debug-output" style={{
                padding: '12px',
                fontFamily: 'monospace',
                fontSize: '12px'
              }}>
                <div style={{ color: '#FFC107' }}>// Static Linter Ready</div>
                <div style={{ color: '#F44336' }}>// Runtime Tracer Ready</div>
                <div style={{ color: '#4CAF50' }}>// Suggestion Engine Ready</div>
              </div>
            </div>
            
            {/* Debug Toggle Button */}
            <button 
              className="debug-toggle"
              onClick={() => setDebugOpen(!debugOpen)}
              style={{
                position: 'absolute',
                left: debugOpen ? '300px' : '0px',
                top: '50%',
                transform: 'translateY(-50%)',
                background: THEME.colors.stateBlue,
                border: 'none',
                color: 'white',
                padding: '8px 12px',
                borderRadius: '0 4px 4px 0',
                cursor: 'pointer',
                transition: 'left 0.3s ease'
              }}
            >
              {debugOpen ? '‹' : '›'}
            </button>
          </div>
          
          {/* Secondary Nav Bar (Workspace Tabs - Bottom) */}
          <nav className="secondary-nav" style={{
            height: THEME.nav.bottomHeight,
            background: THEME.colors.navBackground,
            borderTop: `1px solid ${THEME.colors.grid}`,
            display: 'flex',
            alignItems: 'center',
            padding: '0 16px',
            gap: '8px'
          }}>
            <button 
              className={`workspace-tab ${activeWorkspace === 'Workspace 1' ? 'active' : ''}`}
              onClick={() => setActiveWorkspace('Workspace 1')}
              style={{
                padding: '4px 16px',
                background: activeWorkspace === 'Workspace 1' ? THEME.colors.primary : 'transparent',
                color: activeWorkspace === 'Workspace 1' ? 'white' : THEME.colors.text,
                border: 'none',
                borderRadius: '4px 4px 0 0',
                cursor: 'pointer'
              }}
            >
              Workspace 1
            </button>
            
            <button 
              className="workspace-add"
              style={{
                padding: '4px 12px',
                background: 'transparent',
                color: THEME.colors.text,
                border: `1px dashed ${THEME.colors.grid}`,
                borderRadius: '4px',
                cursor: 'pointer'
              }}
            >
              + Add Workspace
            </button>
          </nav>
        </div>
      );
    }
    
    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    
    // Initialize Lucide Icons
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 100);
  </script>
</body>
</html>
